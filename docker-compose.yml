# Local CouchDB used as the remote replica of the PouchDB database.
# Usage: docker compose up -d  ->  http://localhost:5984/_utils (Fauxton)
services:
  couchdb:
    image: couchdb:3
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:-admin}
    ports:
      - '5984:5984'
    volumes:
      - couchdb-data:/opt/couchdb/data
      - ./docker/couchdb/cors.ini:/opt/couchdb/etc/local.d/cors.ini:ro

volumes:
  couchdb-data:
